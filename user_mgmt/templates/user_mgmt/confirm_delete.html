{% extends "base.html" %}
{% block title %}Delete User{% endblock %}
{% block content %}
<div class="page-hdr"><h2>Delete User</h2></div>
<div class="form-panel" style="max-width:500px">
  <p class="text-danger fw-semibold">Delete user <strong>{{ target_user.username }}</strong>?</p>
  <p class="text-muted small">This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
    <a href="{% url 'user_mgmt:list' %}" class="btn btn-light">Cancel</a>
  </form>
</div>
{% endblock %}
